[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonecli-aworld-agent"
version = "0.1.0"
description = "PhoneCLI Macro+Map agent and M3A baseline for AndroidWorld"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["aworld_agent"]
package-dir = {aworld_agent = "."}

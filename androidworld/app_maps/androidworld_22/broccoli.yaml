common_tasks:
- Browse and view recipes
- Search for specific recipes
- Create a new recipe with photos
- Import recipes from websites
- Manage recipe categories
- Backup and restore recipe data
- Configure app theme and language preferences
- Edit user profile information
known_limitations:
- Navigation relies heavily on the drawer menu which may require multiple taps to
  access deep settings
- File browsing for imports involves navigating through multiple system file manager
  screens
- Some configuration options like backup status are nested within specific settings
  sub-menus

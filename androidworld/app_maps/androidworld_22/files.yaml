common_tasks:
- Browse files by category such as Images, Videos, and Documents
- Search for specific files or documents
- Create new folders to organize content
- Sort files by name, date, or size
- Toggle between grid and list view modes
- View hidden files and folders
- Access recently opened or modified files
- Select multiple files for batch actions
known_limitations:
- Developer debug info screen may appear unexpectedly for specific file types
- Folder creation requires navigating through overlay dialogs rather than direct inline
  action
- Hidden files are not visible by default and require toggling a specific setting

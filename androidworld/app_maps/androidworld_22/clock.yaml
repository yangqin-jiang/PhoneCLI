launch_behavior: always_home
common_tasks:
- Set a new alarm with specific time and repeat days
- Start, pause, or reset a stopwatch
- Set a countdown timer for a specific duration
- Add a new city to the world clock
- Configure bedtime schedule and sleep preferences
- Customize clock display style and theme
- Change alarm sound and vibration settings
- View history of past timer and stopwatch activities
- Access help resources and app settings
known_limitations:
- Settings and help options are hidden behind a menu overlay rather than being directly
  accessible from the main tabs
- Some configuration screens like 'Now playing' customization may be unrelated to
  core clock functions and cause confusion
- Permission dialogs for one-time access may interrupt workflow unexpectedly

common_tasks:
- Browse music library by Songs, Albums, Artists, or Playlists
- Search for specific tracks or artists
- Play, pause, and skip tracks on the Now Playing screen
- Customize app appearance including themes and accent colors
- Configure Now Playing screen layout and controls
- View and manage listening history
- Import playlists from other sources
- Sort music collections by criteria like artist, album, or year
- Adjust audio settings and backup preferences
known_limitations:
- Navigation relies heavily on multiple similar library screens with varying tab orders
- Settings for appearance and Now Playing behavior are split across several sub-menus
- Some configuration options like playback modes may require navigating through minimal
  text-only screens

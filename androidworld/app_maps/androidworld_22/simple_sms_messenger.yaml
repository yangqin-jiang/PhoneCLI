launch_behavior: always_home
common_tasks:
- Start a new conversation with a contact or phone number
- Search for specific messages or contacts
- Access and modify app settings such as notifications and appearance
- Block specific phone numbers or keywords
- View and manage archived conversations
- Customize color themes and general preferences
- Manage the recycle bin for deleted messages
- Export or import message data
- View app information and support resources
known_limitations:
- Settings are distributed across multiple nested menus, requiring navigation through
  several screens to find specific options like blocked keywords or category management
- The app features multiple similar main menu overlays (screens 20-29) which may cause
  confusion regarding the primary entry point for actions like starting a new conversation
- Some advanced configurations and system-level permissions are handled in separate
  system info screens rather than within the app's native settings interface

launch_behavior: always_home
common_tasks:
- Browse photo and video folders
- Search for specific media files
- Capture photos or videos using the built-in camera
- Filter media by type (Images, Videos, GIFs, RAW, SVGs)
- Sort gallery content by name, date, or size
- Customize grid view column count
- Manage hidden folders and files
- Access the Recycle Bin to restore deleted items
- Adjust app theme and color customization settings
known_limitations:
- Settings and management options are distributed across multiple menu screens and
  dialogs
- Folder selection requires navigating through separate dialog interfaces with confirmation
  steps
- Advanced sorting and grouping configurations are located in nested dialogs rather
  than the main toolbar

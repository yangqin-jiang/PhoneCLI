launch_behavior: always_home
common_tasks:
- Search for a contact by name, email, or company
- Create a new contact with details and photo
- View and scroll through the main contacts list
- Manage blocked numbers and import contacts
- Fix and manage duplicate or missing contact info
- Access favorites and recent interactions
- Select files for contact attachments or imports
known_limitations:
- File selection screens (screens 9-28) appear disjointed from core contact tasks,
  potentially confusing users during import/attachment flows
- Settings and management options are nested within a specific 'Fix & manage' tab
  rather than being globally accessible
- Search results may require manual clearing of text to return to the full list view

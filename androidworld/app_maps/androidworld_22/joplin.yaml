launch_behavior: resume_last
common_tasks:
- Create a new note
- Organize notes into notebooks
- Tag notes for categorization
- Search for specific notes or content
- Synchronize notes with cloud storage
- Configure synchronization settings
- Customize app appearance and theme
- Manage installed plugins
- Export notes to JEX format
- Restore deleted notes from trash
known_limitations:
- Sidebar navigation menu is heavily used and may require multiple taps to reach deep
  settings
- Plugin installation requires manual file selection or searching within a dedicated
  screen
- Synchronization configuration involves multiple sub-screens for targets, intervals,
  and encryption
- Some advanced settings like Markdown rendering and note history are buried in separate
  configuration pages

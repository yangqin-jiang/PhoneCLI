common_tasks:
- Search the web using text, voice, or Google Lens
- Open and manage multiple browser tabs
- Browse the Discover feed for content recommendations
- Access and manage browsing history
- Save and organize bookmarks
- View and manage downloaded files
- Switch to Incognito mode for private browsing
- Configure Safe Browsing and privacy settings
- Add a webpage shortcut to the device home screen
known_limitations:
- Security warning screens interrupt navigation and require manual user intervention
  to proceed
- Location permission dialogs can overlay and obscure search suggestions on the new
  tab page
- Some configuration options are nested deep within the multi-level settings menu
- Transient snackbars may disappear quickly before users can act on undo options

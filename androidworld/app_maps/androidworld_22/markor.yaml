launch_behavior: always_home
common_tasks:
- Create new markdown files or folders
- Edit text using the QuickNote feature
- Manage and check off To-Do list items
- Search for files or content using regex options
- Sort files and folders by name, date, or size
- Insert images, links, or other media into documents
- Configure app settings such as theme and language
- Filter To-Do items by priority, due date, or context
- Import existing files from device storage
known_limitations:
- Advanced search configuration (regex, case sensitivity) is hidden within a dialog
  rather than directly on the main screen
- Some file management actions like moving completed tasks require navigating through
  confirmation dialogs
- Context and priority insertion for To-Dos requires opening specific modal dialogs

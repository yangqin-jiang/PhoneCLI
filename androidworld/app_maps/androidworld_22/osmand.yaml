launch_behavior: resume_last
common_tasks:
- Search for a location or Point of Interest
- Plan and start navigation for driving, cycling, or walking
- Toggle map layers and overlays (e.g., POIs, transport, weather)
- Import and display GPS tracks
- Customize map rendering styles and text size
- Configure travel profiles and plugins
- View detailed information about a specific location
known_limitations:
- Map configuration menus often require scrolling through long lists to find specific
  settings
- Language selection requires navigating a separate scrollable list with manual apply
  action
- Some advanced features and plugins are locked behind a Pro subscription
- Returning from full-screen map views or specific modes requires explicit 'Back to
  map' actions

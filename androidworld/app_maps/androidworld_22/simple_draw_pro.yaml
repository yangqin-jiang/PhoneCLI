launch_behavior: always_home
common_tasks:
- Draw on the canvas using various tools
- Fill areas with color using the bucket tool
- Erase parts of the drawing
- Pick colors from the canvas using the eyedropper
- Undo previous actions
- Clear the entire canvas
- Save the drawing in PNG, SVG, or JPG format
- Share the drawing via other installed apps
known_limitations:
- Saving a file requires navigating through multiple dialog screens for format selection
  and file location
- File browser interface may require scrolling to locate specific folders or roots

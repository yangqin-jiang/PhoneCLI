launch_behavior: always_home
common_tasks:
- Create a new task with title and details
- Set due date and time for a task
- Assign priority level to a task
- Add tags or categories to organize tasks
- Search for existing tasks using text or voice input
- Sort tasks by criteria such as due date, priority, or title
- Filter tasks to show only completed or specific lists
- Customize visible input fields in task settings
- Set location-based reminders for tasks
- Share task details with other applications
known_limitations:
- Sort options are distributed across multiple similar menus (screens 10-13), potentially
  causing confusion
- Task customization settings appear on multiple redundant screens (5, 8, 9, 17)
- Voice input is available in some creation flows but may not be consistent across
  all editing screens
- Date and time picking requires navigating through separate dialog overlays (screens
  19, 27)

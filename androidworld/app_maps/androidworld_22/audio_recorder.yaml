launch_behavior: always_home
common_tasks:
- Start a new audio recording
- Configure recording format and sample rate
- Adjust bitrate and channel count settings
- Rename an existing recording
- Delete unwanted recordings
- Access and modify general app settings
- Reset recording configuration to defaults
known_limitations:
- Initial welcome screen requires manual interaction to proceed
- Multiple redundant screens for settings and content management may cause navigation
  confusion
- Renaming dialogs include a 'don't ask again' option that might suppress future prompts
  unexpectedly

common_tasks:
- Connect to Wi-Fi networks
- Toggle Bluetooth on or off
- Adjust screen brightness and theme
- Manage app notifications and permissions
- Check battery usage and enable Battery Saver
- Free up storage space
- Configure screen lock and biometric security
- Update system software
- Manage location services and privacy settings
known_limitations:
- Deeply nested settings may require multiple taps to reach
- Some advanced network options like Private DNS are hidden in sub-menus
- Search results may vary depending on keyword specificity

common_tasks:
- Dial a phone number using the keypad
- Search for contacts by name or number
- View recent call history
- Access favorite contacts
- Create a new contact
- Add a number to an existing contact
- Send an SMS message
- Configure dialer settings
- Use voice search to find contacts
known_limitations:
- Context menus for phone numbers may require multiple taps to access specific actions
  like messaging or saving
- Settings and help options are nested deep within the menu structure
- Search functionality is split between the main keypad screen and dedicated contact
  search interfaces

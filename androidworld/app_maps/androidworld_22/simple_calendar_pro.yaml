launch_behavior: always_home
common_tasks:
- Create a new event or task
- Switch between calendar views (Month, Week, Day)
- Search for specific events
- Configure CalDAV synchronization
- Customize app theme and colors
- Manage notification preferences
- Import or export calendar data
- Adjust default event settings
known_limitations:
- Settings menu contains multiple sub-screens requiring navigation to find specific
  configurations like widgets or backups
- Calendar selection is required when creating events if multiple calendars are active
